model_name_or_path: path/to/your/Qwen3-VL-4B-Instruct
adapter_name_or_path: path/to/your/saves/sft_r2

stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
seed: 42
pref_beta: 0.1
pref_loss: sigmoid

dataset_dir: path/to/your/posttrain-vlm/data/processed/chartqa
dataset: chartqa_dpo
template: qwen3_vl_nothink
overwrite_cache: true
preprocessing_num_workers: 4
cutoff_len: 2048

output_dir: path/to/your/saves/dpo
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true
disable_tqdm: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: sdpa