model_name_or_path: path/to/your/Qwen3-VL-4B-Instruct

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
seed: 42

dataset_dir: path/to/your/posttrain-vlm/data/processed/chartqa
dataset: chartqa_sft_r2
template: qwen3_vl_nothink
overwrite_cache: true
preprocessing_num_workers: 4
cutoff_len: 2048

output_dir: path/to/your/saves/sft_r2
logging_steps: 10
save_steps: 1000
save_total_limit: 2
plot_loss: true
disable_tqdm: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: sdpa